# RAG-AQG Backend v4 Configuration File (Pure YAML)

app:
  backend_host: "0.0.0.0"
  backend_port: 8000
  frontend_port: 3000
  cors_origins:
    - "http://localhost:3000"

llm:
  provider: "deepinfra"
  deepinfra_base_url: "https://api.deepinfra.com/v1/openai"
  # generator_model: "Qwen/Qwen3-32B"
  generator_model: "Qwen/Qwen2.5-72B-Instruct"
  judge_model: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
  embedding_model: "BAAI/bge-m3"
  max_tokens: 4096

validation:
  fast_reject_threshold: 0.40
  grounding_threshold: 0.50
  max_refinement_attempts: 3

database:
  url: "sqlite:///./data/rag_aqg.db"
  chroma_persist_dir: "./data/chroma"

retrieval:
  top_k: 5
  candidate_top_k: 15
  hybrid_dense_weight: 0.6
  hybrid_sparse_weight: 0.4
  reranker_enabled: false

chunking:
  strategy: "fixed"
  fixed_chunk_size: 1000
  fixed_chunk_overlap: 150

