# RAG-AQG Backend v4 Configuration File (Pure YAML)

app:
  backend_host: "0.0.0.0"
  backend_port: 8000
  cors_origins:
    - "http://localhost:3000"

llm:
  provider: "deepinfra"
  deepinfra_base_url: "https://api.deepinfra.com/v1/openai"
  # generator_model: "Qwen/Qwen2.5-72B-Instruct"  # ~20 token/s, terlalu lambat untuk rantai multi-stage
  # generator_model: "Qwen/Qwen3-235B-A22B-Instruct-2507"  # ~20-25 token/s saat paralel, output panjang
  generator_model: "Qwen/Qwen3-Next-80B-A3B-Instruct"
  judge_model: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
  embedding_model: "BAAI/bge-m3"
  max_tokens: 2048  # every stage returns a small JSON object
  request_timeout: 45
  max_retries: 1

validation:
  fast_reject_threshold: 0.40
  max_refinement_attempts: 2

database:
  url: "sqlite:///./data/rag_aqg.db"
  chroma_persist_dir: "./data/chroma"

retrieval:
  candidate_top_k: 15
  hybrid_dense_weight: 0.6
  hybrid_sparse_weight: 0.4
  reranker_enabled: false
  max_questions_per_chunk: 3  # kapasitas maksimum soal dari 1 chunk
  min_relative_score: 0.5     # buang kandidat < 50% skor relevansi teratas
  reserve_chunks: 3           # chunk cadangan untuk ekspansi kapasitas & top-up

generation:
  concurrency: 8
  max_context_chunks: 10  # batas atas jumlah chunk per permintaan

chunking:
  strategy: "fixed"
  fixed_chunk_size: 1000
  fixed_chunk_overlap: 150

