# RAG-AQG Backend v4 Configuration File (Pure YAML)

app:
  backend_host: "0.0.0.0"
  backend_port: 8000
  frontend_port: 3000
  cors_origins:
    - "http://localhost:3000"

llm:
  provider: "openrouter"                          # "openrouter", "groq", "ollama", or "openai"
  openrouter_api_key: "REDACTED_OPENROUTER_API_KEY"
  openrouter_base_url: "https://openrouter.ai/api/v1"
  generator_model: "google/gemma-4-31b-it:free"
  judge_model: "google/gemma-4-31b-it:free"
  
  # Cadangan provider lain
  groq_api_key: "REDACTED_GROQ_API_KEY"
  ollama_base_url: "http://localhost:11434"
  embedding_model: "BAAI/bge-m3"

validation:
  grounding_threshold: 0.50
  grounding_auto_pass_threshold: 0.80
  max_refinement_attempts: 3

database:
  url: "sqlite:///./data/rag_aqg.db"
  chroma_persist_dir: "./data/chroma"

retrieval:
  top_k: 5
  hybrid_dense_weight: 0.6
  hybrid_sparse_weight: 0.4

chunking:
  fixed_chunk_size: 1000
  fixed_chunk_overlap: 150
  semantic_breakpoint_type: "percentile"
  semantic_breakpoint_threshold: 95
