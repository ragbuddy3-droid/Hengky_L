[project]
name = "backend"
version = "4.0.0"
description = "Soalnya backend: RAG-AQG (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.143.0",
    "langchain-core>=1.6.9",
    "langgraph>=1.2.14",
    "sqlalchemy>=2.1.4",
    "pypdf>=6.20.0",
    "pdfplumber>=0.11.10",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "pydantic[email]>=2.14.1",
    "langchain-openai>=1.7.0",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "SIM105"]
