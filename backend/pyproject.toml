[project]
name = "backend"
version = "3.0.0"
description = "FastAPI backend for RAG-AQG (Testing Program v3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "chromadb>=0.5",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "ollama>=0.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
